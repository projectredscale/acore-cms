# The cms-web server block: the WordPress shop edge, plus the MTA-STS policy.
#
# Three things are deliberate here:
#
#   * it listens on 80 only. TLS terminates at Cloudflare and cloudflared forwards
#     to this container by service name, so the host needs no 443 listener and no
#     certificate.
#   * it resolves `php` through Docker's DNS on every request rather than once at
#     startup. The plain `fastcgi_pass php:9000` form caches the address nginx saw
#     when it started, so the next `up -d` that gives the php container a new one
#     leaves this edge answering 502 for the whole shop until it is restarted.
#   * it adds the exact-match location for /.well-known/mta-sts.txt, mounted by
#     cms/compose.yml from $HOST_ROOT/etc/mta-sts.txt.
#
# The status map is not TLS related: it keeps 2xx and 3xx responses out of the access
# log. cms/compose.yml mounts this file at /etc/nginx/conf.d/default.conf, which the
# image's nginx.conf includes inside the http context, so the map and the resolver
# below are valid where they sit. 127.0.0.11 is Docker's embedded DNS.

map $status $loggable
{
    ~^[2] 0;
    ~^[3] 0;
    default 1;
}

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    root /var/www/html;
    index index.php;

    set $php_upstream php:9000;

    access_log /dev/stdout combined if=$loggable;
    error_log /dev/stderr;

    client_max_body_size 128M;

    location = /.well-known/mta-sts.txt {
        root /srv/mtasts;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

	location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
		expires 24h;
		log_not_found off;
	}

	location ^~ /blogs.dir {
		internal;
		alias /var/www/html/wp-content/blogs.dir ;
		access_log off; log_not_found off;      expires max;
	}


	if (!-e $request_filename) {
		rewrite /wp-admin$ $scheme://$host$uri/ permanent;
		rewrite ^/[_0-9a-zA-Z-]+(/wp-.*) $1 last;
		rewrite ^/[_0-9a-zA-Z-]+(/.*\.php)$ $1 last;
	}
}
