# The CMS stack: WordPress, its database, its cache and the nginx edge in front of them.
#
# This file is driven by itself and by nothing else: `docker compose -f cms/compose.yml` from
# the workspace root, with paths for this product's own env file, images and storage. The
# realm's recipes never read it, and it never reads the realm's. What the two stacks share is
# the external `redscale-net` network and the host directories under `HOST_ROOT`.
#
# The shop is not part of a realm release: its image is loaded on the host separately, which
# is why `TAG_CMS` is the one tag no deployment window moves.
#
# `depends_on` names only services in this file, because Compose refuses a dependency on a
# service it cannot see. Nothing here needs the game servers: the plugin reaches them over
# SOAP by service name, and the one published port is bound to the mesh address.

name: ${COMPOSE_PROJECT:-redscale}

services:
  wp-db:
    image: mysql:8@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    pull_policy: missing
    restart: unless-stopped
    command: mysqld --mysql-native-password=ON --binlog_expire_logs_seconds=259200
    environment:
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?}
      TZ: ${TZ:-UTC}
    volumes:
      - wp-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${WORDPRESS_DB_ROOT_PASSWORD:?}"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - redscale-net

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    pull_policy: missing
    restart: unless-stopped
    networks:
      - redscale-net

  # Copies the shop plugin out of the image and into the wordpress-src volume, which would
  # otherwise hide anything the image puts at /var/www/html.
  cms-plugin-init:
    image: ${REGISTRY:?}/redscale-cms:${TAG_CMS:?}
    pull_policy: missing
    restart: "no"
    # One entrypoint argument, not a `command:` string: Compose splits a string command into
    # argv without a shell, and the copy would not run.
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -eu
        mkdir -p /var/www/html/wp-content/plugins
        rm -rf /var/www/html/wp-content/plugins/acore-wp-plugins
        cp -a /opt/redscale/wp-plugins/acore-wp-plugins /var/www/html/wp-content/plugins/acore-wp-plugins
        echo "plugin installed into the WordPress volume"
    volumes:
      - wordpress-src:/var/www/html
    networks:
      - redscale-net

  php:
    image: ${REGISTRY:?}/redscale-cms:${TAG_CMS:?}
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - ${RESOLVED_ENV:?}/cms.env
    # The mail name resolves to the public address, where 465, 587 and 993 are closed, so the
    # name is pointed at the mesh address inside this container: the CMS sends by name, which
    # is what the certificate covers.
    extra_hosts:
      - "${MAIL_DOMAIN:?MAIL_DOMAIN is not set in compose.env}:${MESH_BIND_IP:?MESH_BIND_IP is not set in compose.env}"
    environment:
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?}
      WORDPRESS_CONFIG_EXTRA: |
        # The request reaches nginx over plain HTTP, so the scheme comes from the forwarded
        # header. Both assignments stay inside that test: an unconditional SERVER_PORT of 443
        # makes is_ssl() true for every request, including one over the mesh where 443 is the
        # mail server.
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
            $$_SERVER['SERVER_PORT'] = 443;
        }
        # The image's php.ini allows 128M, and WordPress only raises the limit, so
        # WooCommerce dies at 128M on a store API order with "Allowed memory size
        # exhausted". Both constants have to be set: WordPress applies WP_MEMORY_LIMIT to
        # front end requests, which is what the store API is, and WP_MAX_MEMORY_LIMIT to
        # admin and cron.
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
    volumes:
      - wordpress-src:/var/www/html
    # No bind mount of ./apps or ./conf/dist/php-conf: those would shadow the image's
    # /usr/local/bin/apps and reintroduce a source-checkout dependency.
    depends_on:
      wp-db:
        condition: service_healthy
      redis:
        condition: service_started
      cms-plugin-init:
        condition: service_completed_successfully
    networks:
      - redscale-net

  cms-web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    pull_policy: missing
    restart: unless-stopped
    volumes:
      - ./nginx/wordpress.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress-src:/var/www/html:ro
      # MTA-STS is served for the mail domain over the shop hostname, so the policy does
      # not depend on an inbound port.
      - ${HOST_ROOT:-/srv/redscale}/etc/mta-sts.txt:/srv/mtasts/.well-known/mta-sts.txt:ro
    depends_on:
      php:
        condition: service_started
    # The one published port in this stack, bound to the mesh address: the shop is
    # administrable over the VPN without going out to Cloudflare and back. 80 on the mesh
    # is free, because mail holds 443, 8080, 465, 587, 993 and 4190 and transmission holds
    # 9091. A browser needs the hostname too: point the shop domain at the mesh address on
    # the machine that administers, or WordPress sends it back to the public name.
    ports:
      - "${MESH_BIND_IP:?MESH_BIND_IP is not set in compose.env}:80:80"
    networks:
      - redscale-net

volumes:
  wp-db:
  wordpress-src:

networks:
  redscale-net:
    name: ${REDSCALE_NETWORK:-redscale-net}
    external: true
